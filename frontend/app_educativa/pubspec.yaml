name: app_educativa
description: "Aprendo: app educativa offline para estudiantes de primaria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.6.0
  crypto: ^3.0.3
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Nunito va incluida para funcionar sin internet (licencia en assets/fonts/OFL.txt).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
